<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        :root {
            --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
            --accent-rgb: 148, 163, 184;
            --base-bg: #111215;
            --glass-fill: linear-gradient(155deg, rgba(var(--accent-rgb), 0.045) 0%, rgba(255, 255, 255, 0.024) 100%);
            --glass-border: rgba(255, 255, 255, 0.11);
            --glass-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.18),
                inset 0 -1px 0 rgba(255, 255, 255, 0.03),
                0 10px 26px rgba(0, 0, 0, 0.36);
            --text-primary: rgba(255, 255, 255, 0.94);
            --text-secondary: rgba(255, 255, 255, 0.58);
            --text-muted: rgba(255, 255, 255, 0.38);
        }

        * {
            box-sizing: border-box;
        }

        body {
            position: relative;
            width: 326px;
            margin: 0;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
            background: var(--base-bg);
            color: var(--text-primary);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Clean neutral base with faint 8-12% sampled accent tint at top (no murky wash) */
        .backdrop {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
            background:
                radial-gradient(125% 68% at 50% -12%, rgba(var(--accent-rgb), 0.11) 0%, rgba(var(--accent-rgb), 0.03) 48%, transparent 78%),
                radial-gradient(80% 50% at 15% 0%, rgba(255, 255, 255, 0.035) 0%, transparent 65%);
            transition: opacity 280ms var(--ease-out);
        }

        body[data-state="dim"] .backdrop {
            opacity: 0.4;
        }

        .content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Header with glowing/dimming frosted glass emblem */
        .header {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 2px 2px 4px;
        }

        .brand-mark {
            position: relative;
            width: 36px;
            height: 36px;
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            background: linear-gradient(160deg, rgba(255, 255, 255, 0.88) 0%, rgba(214, 222, 234, 0.80) 100%);
            color: #111215;
            border: 1px solid rgba(255, 255, 255, 0.72);
            box-shadow:
                inset 0 1px 1px rgba(255, 255, 255, 0.9),
                0 0 18px rgba(var(--accent-rgb), 0.24),
                0 4px 12px rgba(0, 0, 0, 0.25);
            transition: opacity 240ms var(--ease-out), filter 240ms var(--ease-out), box-shadow 240ms var(--ease-out);
        }

        .brand-mark::after {
            content: "";
            position: absolute;
            right: -3px;
            bottom: -3px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #30d158;
            border: 2px solid var(--base-bg);
            box-shadow: 0 0 8px rgba(48, 209, 88, 0.75);
            transition: opacity 200ms var(--ease-out), background-color 200ms var(--ease-out), box-shadow 200ms var(--ease-out);
        }

        body[data-state="standby"] .brand-mark {
            background: linear-gradient(160deg, rgba(255, 255, 255, 0.22) 0%, rgba(255, 255, 255, 0.10) 100%);
            color: rgba(255, 255, 255, 0.88);
            border-color: rgba(251, 191, 36, 0.45);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.22),
                0 0 12px rgba(251, 191, 36, 0.18);
        }

        body[data-state="standby"] .brand-mark::after {
            background: #fbbf24;
            box-shadow: 0 0 6px rgba(251, 191, 36, 0.65);
        }

        body[data-state="dim"] .brand-mark {
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.42);
            border-color: rgba(255, 255, 255, 0.10);
            box-shadow: none;
            opacity: 0.48;
        }

        body[data-state="dim"] .brand-mark::after {
            opacity: 0;
        }

        .brand-text {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .brand-title {
            margin: 0;
            font-size: 15.5px;
            font-weight: 600;
            letter-spacing: -0.25px;
            color: var(--text-primary);
            line-height: 1.2;
        }

        .brand-subtitle {
            margin-top: 2px;
            font-size: 11.5px;
            font-weight: 500;
            color: #4ade80;
            transition: color 200ms var(--ease-out);
        }

        body[data-state="standby"] .brand-subtitle {
            color: #fbbf24;
        }

        body[data-state="dim"] .brand-subtitle {
            color: var(--text-muted);
        }

        /* Crisp Frosted Liquid Glass Cards */
        .glass-card {
            position: relative;
            background: var(--glass-fill);
            backdrop-filter: blur(24px) saturate(140%);
            -webkit-backdrop-filter: blur(24px) saturate(140%);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            box-shadow: var(--glass-shadow);
            overflow: hidden;
        }

        .glass-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(125deg, rgba(255, 255, 255, 0.065) 0%, rgba(255, 255, 255, 0) 46%);
            pointer-events: none;
        }

        .current-anime {
            padding: 13px 14px 14px;
        }

        .eyebrow {
            margin: 0 0 7px 0;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.9px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .anime-title-row {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 7px;
        }

        .play-glyph {
            width: 19px;
            height: 19px;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-top: 1px;
            background: rgba(var(--accent-rgb), 0.14);
            border: 1px solid rgba(var(--accent-rgb), 0.28);
            color: var(--text-primary);
        }

        .anime-title {
            font-size: 14.5px;
            font-weight: 600;
            line-height: 1.3;
            color: #ffffff;
            word-break: break-word;
        }

        .anime-meta {
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .time-readout {
            font-variant-numeric: tabular-nums;
        }

        .site-badge {
            margin-left: auto;
            background: rgba(var(--accent-rgb), 0.12);
            border: 1px solid rgba(var(--accent-rgb), 0.26);
            color: rgba(255, 255, 255, 0.90);
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 500;
        }

        .progress-track {
            margin-top: 11px;
            height: 3px;
            width: 100%;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            border-radius: 999px;
            background: rgba(var(--accent-rgb), 0.92);
            transition: width 250ms var(--ease-out), background-color 280ms var(--ease-out);
        }

        .no-anime {
            text-align: center;
            padding: 20px 14px;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
        }

        .no-anime small {
            display: block;
            margin-top: 4px;
            color: var(--text-muted);
            font-size: 11.5px;
            font-weight: 400;
        }

        /* Settings Card */
        .settings-card {
            padding: 4px 14px;
        }

        .setting-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 9px 0;
            font-size: 12.5px;
            color: rgba(255, 255, 255, 0.86);
        }

        .setting-row:not(:last-child) {
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .switch-label {
            cursor: pointer;
            user-select: none;
            flex: 1;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 34px;
            height: 19px;
            flex-shrink: 0;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
            position: absolute;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 999px;
            transition: background-color 180ms var(--ease-out), border-color 180ms var(--ease-out);
        }

        .slider::before {
            position: absolute;
            content: "";
            height: 13px;
            width: 13px;
            left: 2px;
            top: 2px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 50%;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
            transition: transform 180ms var(--ease-out), background-color 180ms var(--ease-out);
        }

        input:checked + .slider {
            background: rgba(var(--accent-rgb), 0.42);
            border-color: rgba(var(--accent-rgb), 0.58);
        }

        input:checked + .slider::before {
            transform: translateX(15px);
            background: #ffffff;
        }

        input:focus-visible + .slider {
            outline: 2px solid rgba(var(--accent-rgb), 0.8);
            outline-offset: 2px;
        }

        /* Action Buttons */
        .buttons {
            display: flex;
            gap: 9px;
        }

        button {
            flex: 1;
            padding: 9px 12px;
            border-radius: 12px;
            font-size: 12.5px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transition: transform 160ms var(--ease-out), background-color 180ms var(--ease-out), border-color 180ms var(--ease-out);
        }

        button:active {
            transform: scale(0.97);
        }

        button:focus-visible {
            outline: 2px solid rgba(var(--accent-rgb), 0.8);
            outline-offset: 2px;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.03);
            color: rgba(255, 255, 255, 0.82);
            border: 1px solid rgba(255, 255, 255, 0.11);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.075);
            color: #ffffff;
        }

        .btn-primary {
            background: rgba(var(--accent-rgb), 0.18);
            color: #ffffff;
            font-weight: 600;
            border: 1px solid rgba(var(--accent-rgb), 0.34);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22), 0 6px 18px rgba(0, 0, 0, 0.24);
        }

        .btn-primary:hover {
            background: rgba(var(--accent-rgb), 0.26);
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                transition: none !important;
                animation: none !important;
            }
            button:active {
                transform: none;
            }
        }
    </style>
</head>
<body data-state="dim">
    <div class="backdrop" aria-hidden="true"></div>

    <div class="content">
        <header class="header">
            <div class="brand-mark" id="brandMark" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M8 5.14v13.72c0 .79.87 1.27 1.54.84l10.67-6.86a1 1 0 0 0 0-1.68L9.54 4.3A1 1 0 0 0 8 5.14z"/>
                </svg>
            </div>
            <div class="brand-text">
                <h1 class="brand-title">Anime Rich Presence</h1>
                <div class="brand-subtitle" id="statusText">Checking connection...</div>
            </div>
        </header>

        <section id="currentAnime">
            <div class="glass-card no-anime">
                No anime detected
                <small>Start watching on Miruro or AnimePahe</small>
            </div>
        </section>

        <section class="glass-card settings-card">
            <div class="setting-row">
                <label class="switch-label" for="privacyToggle">Privacy Mode (Hide title)</label>
                <label class="switch">
                    <input type="checkbox" id="privacyToggle">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="setting-row">
                <label class="switch-label" for="episodeToggle">Show Episode Number</label>
                <label class="switch">
                    <input type="checkbox" id="episodeToggle" checked>
                    <span class="slider"></span>
                </label>
            </div>
            <div class="setting-row">
                <label class="switch-label" for="progressToggle">Show Playback Progress</label>
                <label class="switch">
                    <input type="checkbox" id="progressToggle" checked>
                    <span class="slider"></span>
                </label>
            </div>
            <div class="setting-row">
                <label class="switch-label" for="siteToggle">Show Streaming Site</label>
                <label class="switch">
                    <input type="checkbox" id="siteToggle" checked>
                    <span class="slider"></span>
                </label>
            </div>
        </section>

        <footer class="buttons">
            <button class="btn-secondary" id="clearBtn">Clear Activity</button>
            <button class="btn-primary" id="refreshBtn">Refresh</button>
        </footer>
    </div>

    <script src="popup.js"></script>
</body>
</html>
