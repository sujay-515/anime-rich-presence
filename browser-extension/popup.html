<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            width: 320px;
            padding: 20px;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(145deg, #0f1015 0%, #171821 100%);
            color: #f2f3f5;
            margin: 0;
            overflow-x: hidden;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(90deg, #8ea1e1 0%, #a27ae1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            padding: 10px 14px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(10px);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ed4245;
            box-shadow: 0 0 10px rgba(237, 66, 69, 0.4);
            transition: all 0.3s ease;
        }

        .status-dot.connected {
            background: #57f287;
            box-shadow: 0 0 12px rgba(87, 242, 135, 0.6);
        }

        .status-dot.warn {
            background: #fee75c;
            box-shadow: 0 0 10px rgba(254, 231, 92, 0.4);
        }

        .status-text {
            font-size: 13px;
            font-weight: 500;
            color: #dbdee1;
        }

        .current-anime {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 18px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            transition: all 0.2s ease;
        }

        .current-anime:hover {
            border-color: rgba(255, 255, 255, 0.12);
        }

        .current-anime h3 {
            margin: 0 0 10px 0;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8ea1e1;
            font-weight: 600;
        }

        .anime-title {
            font-size: 15px;
            font-weight: 600;
            line-height: 1.35;
            color: #fff;
            margin-bottom: 6px;
        }

        .anime-meta {
            font-size: 12.5px;
            color: #949ba4;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 6px;
        }

        .site-badge {
            background: rgba(88, 101, 242, 0.15);
            color: #8ea1e1;
            padding: 2px 7px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
        }

        .no-anime {
            text-align: center;
            color: #949ba4;
            font-size: 13px;
            padding: 24px 14px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            border: 1px dashed rgba(255, 255, 255, 0.08);
            margin-bottom: 18px;
        }

        .no-anime small {
            display: block;
            margin-top: 6px;
            color: #5c626d;
            font-size: 11.5px;
        }

        .settings-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            padding: 12px 14px;
            margin-bottom: 20px;
        }

        .setting-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 12.5px;
            color: #dbdee1;
        }

        .setting-row:not(:last-child) {
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .switch-label {
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 32px;
            height: 18px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #2b2d31;
            transition: .2s ease;
            border-radius: 18px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 12px;
            width: 12px;
            left: 3px;
            bottom: 3px;
            background-color: #dbdee1;
            transition: .2s ease;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #5865f2;
        }

        input:checked + .slider:before {
            transform: translateX(14px);
            background-color: #fff;
        }

        .buttons {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 10px 14px;
            border: none;
            border-radius: 10px;
            font-size: 12.5px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-primary {
            background: #5865f2;
            color: white;
            box-shadow: 0 4px 15px rgba(88, 101, 242, 0.3);
        }

        .btn-primary:hover {
            background: #4752c4;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            color: #dbdee1;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎌 Anime Rich Presence</h1>
    </div>

    <div class="status">
        <div class="status-dot" id="statusDot"></div>
        <div class="status-text" id="statusText">Checking connection...</div>
    </div>

    <div id="currentAnime">
        <div class="no-anime">
            No anime detected
            <small>Start watching on Miruro or AnimePahe!</small>
        </div>
    </div>

    <div class="settings-card">
        <div class="setting-row">
            <label class="switch-label" for="privacyToggle">Privacy Mode (Hide title)</label>
            <label class="switch">
                <input type="checkbox" id="privacyToggle">
                <span class="slider"></span>
            </label>
        </div>
        <div class="setting-row">
            <label class="switch-label" for="episodeToggle">Show Episode Number</label>
            <label class="switch">
                <input type="checkbox" id="episodeToggle" checked>
                <span class="slider"></span>
            </label>
        </div>
        <div class="setting-row">
            <label class="switch-label" for="progressToggle">Show Playback Progress</label>
            <label class="switch">
                <input type="checkbox" id="progressToggle" checked>
                <span class="slider"></span>
            </label>
        </div>
        <div class="setting-row">
            <label class="switch-label" for="siteToggle">Show Streaming Site</label>
            <label class="switch">
                <input type="checkbox" id="siteToggle" checked>
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <div class="buttons">
        <button class="btn-secondary" id="clearBtn">Clear Activity</button>
        <button class="btn-primary" id="refreshBtn">Refresh</button>
    </div>

    <script src="popup.js"></script>
</body>
</html>
